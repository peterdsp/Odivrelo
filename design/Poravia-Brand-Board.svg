<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760"
     role="img" aria-labelledby="board-title board-desc"
     font-family="Inter, 'SF Pro Text', Roboto, system-ui, sans-serif">
  <title id="board-title">Poravia brand board</title>
  <desc id="board-desc">Poravia logo, colour palette, typography scale and the trust chips that carry the product's freshness, confidence and demonstration-data states.</desc>

  <rect width="1200" height="760" fill="#F6F7F2"/>

  <!-- Header -->
  <g transform="translate(64,56)">
    <g transform="translate(0,-6) scale(0.95)">
      <path d="M10 50V30a13 13 0 0 1 26 0v20" fill="none" stroke="#0B6B63" stroke-width="6" stroke-linecap="round"/>
      <circle cx="23" cy="33" r="4.5" fill="#F2B84B"/>
    </g>
    <text x="52" y="40" font-size="38" font-weight="720" letter-spacing="-0.8" fill="#142E2C">Poravia</text>
    <text x="52" y="66" font-size="16" font-weight="450" fill="#4E615D">Travel with certainty.  ·  Ταξίδεψε με βεβαιότητα.  ·  Udhëto me siguri.</text>
  </g>
  <line x1="64" y1="148" x2="1136" y2="148" stroke="#CBD8D4" stroke-width="1"/>

  <!-- Marks -->
  <text x="64" y="188" font-size="14" font-weight="650" letter-spacing="0.6" fill="#4E615D">MARK</text>
  <g transform="translate(64,204)">
    <g><rect width="96" height="96" rx="22" fill="#0B6B63"/>
       <g transform="translate(16,16) scale(1)">
         <path d="M16 53V30a16 16 0 0 1 32 0v23" fill="none" stroke="#EFF7F5" stroke-width="7.5" stroke-linecap="round" transform="scale(1)"/>
         <circle cx="32" cy="34" r="5.5" fill="#F2B84B"/>
       </g>
    </g>
    <g transform="translate(120,0)"><rect width="96" height="96" rx="22" fill="#0D1B1A"/>
       <g transform="translate(16,16)">
         <path d="M16 53V30a16 16 0 0 1 32 0v23" fill="none" stroke="#52C8BC" stroke-width="7.5" stroke-linecap="round"/>
         <circle cx="32" cy="34" r="5.5" fill="#F2B84B"/>
       </g>
    </g>
    <g transform="translate(240,0)"><rect width="96" height="96" rx="22" fill="#FFFFFF" stroke="#CBD8D4"/>
       <g transform="translate(16,16)" color="#142E2C">
         <path d="M16 53V30a16 16 0 0 1 32 0v23" fill="none" stroke="currentColor" stroke-width="7.5" stroke-linecap="round"/>
         <circle cx="32" cy="34" r="5.5" fill="currentColor"/>
       </g>
    </g>
    <text x="0" y="118" font-size="13" fill="#4E615D">An arch is a passage. The amber point inside it is the exact boarding point,</text>
    <text x="0" y="136" font-size="13" fill="#4E615D">which is the one fact the product exists to get right.</text>
  </g>

  <!-- Palette -->
  <text x="64" y="404" font-size="14" font-weight="650" letter-spacing="0.6" fill="#4E615D">PALETTE</text>
  <g transform="translate(64,420)">
    <g><rect width="128" height="64" rx="10" fill="#0B6B63"/><text x="0" y="82" font-size="12" font-weight="650" fill="#142E2C">Aegean 600</text><text x="0" y="98" font-size="11" fill="#4E615D">#0B6B63 · primary</text></g>
    <g transform="translate(144,0)"><rect width="128" height="64" rx="10" fill="#064B47"/><text x="0" y="82" font-size="12" font-weight="650" fill="#142E2C">Aegean 700</text><text x="0" y="98" font-size="11" fill="#4E615D">#064B47 · pressed</text></g>
    <g transform="translate(288,0)"><rect width="128" height="64" rx="10" fill="#52C8BC"/><text x="0" y="82" font-size="12" font-weight="650" fill="#142E2C">Aegean 300</text><text x="0" y="98" font-size="11" fill="#4E615D">#52C8BC · dark primary</text></g>
    <g transform="translate(432,0)"><rect width="128" height="64" rx="10" fill="#F2B84B"/><text x="0" y="82" font-size="12" font-weight="650" fill="#142E2C">Sun 500</text><text x="0" y="98" font-size="11" fill="#4E615D">#F2B84B · focus, point</text></g>
    <g transform="translate(576,0)"><rect width="128" height="64" rx="10" fill="#F6F7F2" stroke="#CBD8D4"/><text x="0" y="82" font-size="12" font-weight="650" fill="#142E2C">Canvas</text><text x="0" y="98" font-size="11" fill="#4E615D">#F6F7F2 · limestone</text></g>
    <g transform="translate(720,0)"><rect width="128" height="64" rx="10" fill="#142E2C"/><text x="0" y="82" font-size="12" font-weight="650" fill="#142E2C">Stone 900</text><text x="0" y="98" font-size="11" fill="#4E615D">#142E2C · ink</text></g>
    <g transform="translate(864,0)"><rect width="128" height="64" rx="10" fill="#8F2F25"/><text x="0" y="82" font-size="12" font-weight="650" fill="#142E2C">Coral 700</text><text x="0" y="98" font-size="11" fill="#4E615D">#8F2F25 · error</text></g>
  </g>

  <!-- Type -->
  <text x="64" y="566" font-size="14" font-weight="650" letter-spacing="0.6" fill="#4E615D">TYPE</text>
  <g transform="translate(64,616)" fill="#142E2C">
    <text x="0" y="0" font-size="40" font-weight="720" letter-spacing="-0.8">Display 40</text>
    <text x="260" y="0" font-size="28" font-weight="700" letter-spacing="-0.4">Title 28</text>
    <text x="440" y="0" font-size="20" font-weight="680">Heading 20</text>
    <text x="600" y="0" font-size="16" font-weight="450">Body 16</text>
    <text x="710" y="0" font-size="14" font-weight="650">Label 14</text>
    <text x="810" y="0" font-size="12" font-weight="520" fill="#4E615D">Caption 12</text>
  </g>

  <!-- Trust chips -->
  <text x="64" y="666" font-size="14" font-weight="650" letter-spacing="0.6" fill="#4E615D">TRUST STATES</text>
  <g transform="translate(64,682)">
    <g><rect width="164" height="34" rx="17" fill="#E3F3E9"/><text x="16" y="22" font-size="13" font-weight="650" fill="#185C38">Checked 6 hours ago</text></g>
    <g transform="translate(180,0)"><rect width="132" height="34" rx="17" fill="#FFF1C9"/><text x="16" y="22" font-size="13" font-weight="650" fill="#4A2E00">Ageing, 4 days</text></g>
    <g transform="translate(328,0)"><rect width="120" height="34" rx="17" fill="#FCE8E5"/><text x="16" y="22" font-size="13" font-weight="650" fill="#8F2F25">Stale, verify</text></g>
    <g transform="translate(464,0)"><rect width="150" height="34" rx="17" fill="#E5F0FA"/><text x="16" y="22" font-size="13" font-weight="650" fill="#174F83">Scheduled, not live</text></g>
    <g transform="translate(630,0)"><rect width="330" height="34" rx="8" fill="#4A2E00"/><text x="16" y="22" font-size="13" font-weight="650" fill="#FFF1C9">Demonstration data. Not a real departure.</text></g>
  </g>
</svg>
