[pytest]
# Run from server/api. The package is imported from the working directory rather
# than installed, so tests exercise exactly the tree under review.
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers --strict-config
filterwarnings =
    error
    # Starlette 0.48 still refers to the deprecated anyio.abc alias.
    default:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
