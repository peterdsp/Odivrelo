[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poravia-pipeline"
version = "0.1.0"
description = "Bounded, rights-aware acquisition pipeline for Poravia"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name = "Petros Dhespollari", email = "info@peterdsp.dev" }
]
dependencies = []

[project.scripts]
poravia-pipeline = "poravia_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py39"
