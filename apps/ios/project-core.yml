# Overlay spec used only when shared/core has produced PoraviaCore.xcframework.
# scripts/ios-bootstrap.sh selects this spec automatically; it is never used
# when the framework is absent, so the base spec always stays buildable.
include:
  - project.yml

targets:
  Poravia:
    settings:
      base:
        PORAVIA_CORE_CONDITION: PORAVIA_CORE_AVAILABLE
        # There is deliberately no -lsqlite3 here. The core embeds SQLDelight's
        # native driver, which needs the system SQLite, but each slice's module
        # map now declares link "sqlite3" and clang autolinking supplies it.
        # Checked rather than assumed: the Release simulator build, the Release
        # device build and the test build all link, and otool on the device
        # binary shows /usr/lib/libsqlite3.dylib among its load commands. If a
        # future build path bypasses autolinking, the symptom is an undefined
        # _sqlite3_step at link time and the flag comes back here.
    dependencies:
      - framework: Frameworks/PoraviaCore.xcframework
        embed: false
        link: true
  PoraviaTests:
    settings:
      base:
        PORAVIA_CORE_CONDITION: PORAVIA_CORE_AVAILABLE
