name: Poravia
options:
  bundleIdPrefix: dev.peterdsp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false
  xcodeVersion: "2700"

configs:
  Debug: debug
  Release: release

settingGroups:
  common:
    base:
      SWIFT_VERSION: "6.0"
      SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      TARGETED_DEVICE_FAMILY: "1,2"
      ENABLE_USER_SCRIPT_SANDBOXING: YES
      CLANG_ENABLE_MODULES: YES
      DEAD_CODE_STRIPPING: YES
      GCC_TREAT_WARNINGS_AS_ERRORS: NO
      SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
      CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
      LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      SWIFT_EMIT_LOC_STRINGS: YES
      ENABLE_HARDENED_RUNTIME: NO
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
      CODE_SIGN_STYLE: Manual
      DEVELOPMENT_TEAM: ""

targets:
  Poravia:
    type: application
    platform: iOS
    settings:
      groups: [common]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.peterdsp.poravia
        PRODUCT_NAME: Poravia
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "10000"
        INFOPLIST_FILE: Poravia/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Poravia/Resources/Poravia.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: complete
        DEVELOPMENT_ASSET_PATHS: ""
        OTHER_LDFLAGS: "$(inherited)"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Frameworks"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(PORAVIA_CORE_CONDITION)"
          ONLY_ACTIVE_ARCH: YES
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(PORAVIA_CORE_CONDITION)"
          SWIFT_COMPILATION_MODE: wholemodule
          VALIDATE_PRODUCT: YES
          # Coverage instrumentation belongs to the test action. Leaving it on
          # puts an __LLVM_COV segment into the shipped binary.
          ENABLE_CODE_COVERAGE: NO
          CLANG_COVERAGE_MAPPING: NO
          SWIFT_USE_INTEGRATED_DRIVER: YES
    sources:
      - path: Poravia
        excludes:
          - "Resources/Info.plist"
          - "Resources/Poravia.entitlements"
          # The trilingual source of truth is an input to
          # scripts/ios-generate-strings.sh, not a shipped resource. The
          # compiled String Catalog is what the app reads.
          - "Resources/strings.source.json"
          # Added below as a folder reference so the bundle keeps the
          # release/manifest.json and release/packs/... layout the core expects.
          # A flat resource scan would drop the directory and the seeding would
          # find nothing.
          - "Resources/release"
      # The release bundled with the application, copied byte for byte from the
      # one generator by scripts/ios-sync-packs.sh. It lets a fresh install
      # search offline before any download. The core verifies every digest in
      # adoptSeededRelease(), so shipping it grants no extra trust.
      - path: Poravia/Resources/release
        type: folder
    dependencies: []
    scheme:
      testTargets:
        - PoraviaTests
        - PoraviaUITests
      gatherCoverageData: true
      environmentVariables:
        - variable: PORAVIA_DISABLE_ANIMATIONS
          value: "0"
          isEnabled: false

  PoraviaTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      groups: [common]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.peterdsp.poravia.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(PORAVIA_CORE_CONDITION)"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(PORAVIA_CORE_CONDITION)"
    sources:
      - path: PoraviaTests
    dependencies:
      - target: Poravia

  PoraviaUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      groups: [common]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.peterdsp.poravia.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Poravia
        SWIFT_STRICT_CONCURRENCY: minimal
    sources:
      - path: PoraviaUITests
    dependencies:
      - target: Poravia

schemes:
  Poravia:
    build:
      targets:
        Poravia: all
        PoraviaTests: [test]
        PoraviaUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - PoraviaTests
        - PoraviaUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
