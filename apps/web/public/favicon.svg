<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="poravia-mark-title">
  <title id="poravia-mark-title">Poravia</title>
  <!-- The mark is a passage: an arch you travel through, with the exact
       boarding point marked inside it. Aegean teal ground, sun amber point. -->
  <rect width="64" height="64" rx="15" fill="#0B6B63"/>
  <path d="M16 53V30a16 16 0 0 1 32 0v23"
        fill="none" stroke="#EFF7F5" stroke-width="7.5" stroke-linecap="round"/>
  <circle cx="32" cy="34" r="5.5" fill="#F2B84B"/>
</svg>
