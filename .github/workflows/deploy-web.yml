name: Deploy Web release

# Distribution is deliberately separate from ordinary CI: it only ever runs on
# a release tag or a manual dispatch, never on a pull request, so untrusted
# code can never reach the deployment credentials.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      reason:
        description: Why this deployment is being run
        required: true
        type: string
      release_channel:
        description: >
          Which dataset to ship. "demo" builds the labelled Aloria demonstration
          release. "production" builds from a reviewed real dataset and fails if
          none is provided; it never falls back to demo.
        required: false
        default: demo
        type: choice
        options: [demo, production]

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish to Cloudflare Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Generate the public release packs and assert their properties
        env:
          # Default demo keeps tag deploys shipping the clearly labelled
          # demonstration release. Flip to production, with a reviewed dataset
          # wired in, for a real launch. The build guards the result either way.
          RELEASE_CHANNEL: ${{ github.event.inputs.release_channel || vars.RELEASE_CHANNEL || 'demo' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r server/api/requirements.txt
          PY=python bash scripts/build-release.sh
      - name: Copy packs into the web public directory
        run: bash scripts/web-sync-packs.sh
      - name: Split the web stops pack for Pages file limits
        run: python3 scripts/split-web-stops-pack.py apps/web/public/data
      - run: npm ci
        working-directory: apps/web
      - name: Build, stamped with version, commit and release
        working-directory: apps/web
        env:
          VITE_APP_VERSION: "1.0.0"
          VITE_GIT_COMMIT: ${{ github.sha }}
          VITE_BUILD_TIME: ${{ github.event.repository.updated_at }}
        run: npm run build
      - name: Verify the built site carries no old-brand string
        run: bash scripts/check-brand.sh --dist apps/web/dist
      # Cloudflare Pages serves _headers, so the full security header set
      # applies. The project `odivrelo` owns odivrelo.peterdsp.dev.
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4 pages deploy apps/web/dist
          --project-name odivrelo --branch main
          --commit-hash "$GITHUB_SHA" --commit-message "$GITHUB_REF_NAME"

  verify:
    name: Verify the live deployment
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check DNS, HTTPS, the homepage, deep links and the release identity
        run: bash scripts/verify-deployment.sh https://odivrelo.peterdsp.dev
