name: Deploy Web release

# Distribution is deliberately separate from ordinary CI: it only ever runs on
# a release tag or a manual dispatch, never on a pull request, so untrusted
# code can never reach the deployment credentials.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      reason:
        description: Why this deployment is being run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish to Cloudflare Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Generate the public release packs and assert their properties
        run: |
          python -m pip install --upgrade pip
          pip install -r server/api/requirements.txt
          PY=python bash scripts/ci-pipeline-smoke.sh
      - name: Copy packs into the web public directory
        run: bash scripts/web-sync-packs.sh
      - run: npm ci
        working-directory: apps/web
      - name: Build, stamped with version, commit and release
        working-directory: apps/web
        env:
          VITE_APP_VERSION: "1.0.0"
          VITE_GIT_COMMIT: ${{ github.sha }}
          VITE_BUILD_TIME: ${{ github.event.repository.updated_at }}
        run: npm run build
      - name: Verify the built site carries no old-brand string
        run: bash scripts/check-brand.sh --dist apps/web/dist
      # Cloudflare Pages serves _headers, so the full security header set
      # applies. The project `poravia` owns poravia.peterdsp.dev.
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4 pages deploy apps/web/dist
          --project-name poravia --branch main
          --commit-hash "$GITHUB_SHA" --commit-message "$GITHUB_REF_NAME"

  verify:
    name: Verify the live deployment
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check DNS, HTTPS, the homepage, deep links and the release identity
        run: bash scripts/verify-deployment.sh https://poravia.peterdsp.dev
