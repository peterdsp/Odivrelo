name: Deploy Web release

# Distribution is deliberately separate from ordinary CI: it only ever runs on
# a release tag or a manual dispatch, never on a pull request, so untrusted
# code can never reach the deployment credentials.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      reason:
        description: Why this deployment is being run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  build:
    name: Build the release artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Generate the public release packs
        run: bash scripts/ci-pipeline-smoke.sh
      - name: Copy packs into the web public directory
        run: bash scripts/web-sync-packs.sh artifacts/releases/poravia
      - run: npm ci
        working-directory: apps/web
      - name: Build, stamped with version, commit and release
        working-directory: apps/web
        env:
          VITE_APP_VERSION: "1.0.0"
          VITE_GIT_COMMIT: ${{ github.sha }}
          VITE_BUILD_TIME: ${{ github.event.repository.updated_at }}
        run: npm run build
      - name: Verify the built site carries no old-brand string
        run: bash scripts/check-brand.sh --dist apps/web/dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify the live deployment
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check DNS, HTTPS, the homepage, deep links and the release identity
        run: bash scripts/verify-deployment.sh https://poravia.peterdsp.dev
