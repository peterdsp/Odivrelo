name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
  workflow_dispatch:

# Least privilege by default. Jobs that need more ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  JAVA_VERSION: "21"

jobs:
  data-pipeline:
    name: Data pipeline and release contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run the staging suite
        working-directory: server/ktel-staging
        run: PYTHONPATH=. python -m unittest discover -s tests -v
      - name: Prove the pipeline runs end to end
        run: bash scripts/ci-pipeline-smoke.sh
      - name: Upload the generated release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-packs
          path: artifacts/releases/
          retention-days: 7
          if-no-files-found: warn

  api:
    name: Public API service
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f server/api/requirements.txt ]; then pip install -r server/api/requirements.txt; fi
          if [ -f server/api/requirements-dev.txt ]; then pip install -r server/api/requirements-dev.txt; fi
      - name: Tests
        run: |
          if [ -d server/api/tests ]; then pytest server/api/tests -q; else echo "no api tests yet"; exit 1; fi

  contracts:
    name: Contract drift gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Regenerate contracts and fail on drift
        run: bash scripts/gen-contracts.sh --check

  brand:
    name: Rename gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: No stray old-brand strings and no unresolved placeholders
        run: bash scripts/check-brand.sh

  web:
    name: Web application
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Generate the release and sync its packs
        run: |
          python -m pip install --upgrade pip
          pip install -r server/api/requirements.txt
          PY=python bash scripts/api-seed-demo.sh
          bash scripts/web-sync-packs.sh
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm run test -- --run
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 7

  shared-and-android:
    name: Shared core and Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate the release and sync its packs
        run: |
          python -m pip install --upgrade pip
          pip install -r server/api/requirements.txt
          PY=python bash scripts/api-seed-demo.sh
          bash scripts/android-sync-packs.sh
      - name: Shared core tests
        run: ./gradlew :shared:core:allTests --no-daemon --stacktrace
      - name: Android unit tests
        run: ./gradlew :apps:android:testDebugUnitTest --no-daemon
      - name: Assemble debug and release
        run: ./gradlew :apps:android:assembleDebug :apps:android:assembleRelease :apps:android:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-artifacts
          path: |
            apps/android/build/outputs/apk/**/*.apk
            apps/android/build/outputs/bundle/**/*.aab
            apps/android/build/outputs/mapping/**/mapping.txt
          retention-days: 7
          if-no-files-found: warn

  ios:
    name: iOS build and tests
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Generate the release
        run: |
          python -m pip install --upgrade pip
          pip install -r server/api/requirements.txt
          PY=python bash scripts/api-seed-demo.sh
      - name: Build the shared XCFramework
        run: bash scripts/shared-build-xcframework.sh
      - name: Build and test
        run: bash scripts/ios-ci-build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-logs
          path: apps/ios/artifacts/
          retention-days: 7
          if-no-files-found: ignore
